services:
  vpp-service:
    build:
      context: .
      dockerfile: services/vpp/Dockerfile
    container_name: sailboat-vpp-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    networks:
      - routing-network

  routing-service:
    build:
      context: ./services/routing
      dockerfile: Dockerfile
    container_name: sailboat-routing-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - VPP_SERVICE_URL=http://vpp-service:8000
    depends_on:
      - vpp-service
    restart: unless-stopped
    networks:
      - routing-network

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: sailboat-routing-frontend
    ports:
      - "3333:80"
    depends_on:
      - routing-service
      - vpp-service
    restart: unless-stopped
    networks:
      - routing-network

networks:
  routing-network:
    driver: bridge
