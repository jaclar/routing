services:
  caddy:
    image: caddy:2-alpine
    container_name: sailboat-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - routing-service
      - vpp-service
      - meteo-service
    networks:
      - routing-network

  vpp-service:
    build:
      context: ./services/vpp
      dockerfile: Dockerfile
    container_name: sailboat-vpp-service
    environment:
      - PORT=4001
    restart: unless-stopped
    networks:
      - routing-network

  meteo-service:
    build:
      context: ./services/meteo
      dockerfile: Dockerfile
    container_name: sailboat-meteo-service
    environment:
      - PORT=4081
      - DATA_DIR=/data/store
    volumes:
      - /data/store:/data/store
    restart: unless-stopped
    networks:
      - routing-network

  meteo-worker:
    build:
      context: ./services/meteo
      dockerfile: Dockerfile
    container_name: sailboat-meteo-worker
    command: ["/app/meteo-worker", "--daemon", "--poll-interval=10", "--concurrency=8"]
    environment:
      - DATA_DIR=/data/store
      - STORE_FULL_ENSEMBLE=${STORE_FULL_ENSEMBLE:-false}
    volumes:
      - /data/store:/data/store
    restart: unless-stopped
    networks:
      - routing-network

  routing-service:
    build:
      context: ./services/routing
      dockerfile: Dockerfile
    container_name: sailboat-routing-service
    environment:
      - PORT=4080
      - VPP_SERVICE_URL=http://vpp-service:4001
      - METEO_SERVICE_URL=http://meteo-service:4081
    depends_on:
      - vpp-service
      - meteo-service
    restart: unless-stopped
    networks:
      - routing-network

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: sailboat-routing-frontend
    depends_on:
      - routing-service
      - vpp-service
      - meteo-service
    restart: unless-stopped
    networks:
      - routing-network

networks:
  routing-network:
    driver: bridge

volumes:
  caddy_data:
    name: sailboat_caddy_data
  caddy_config:
    name: sailboat_caddy_config

