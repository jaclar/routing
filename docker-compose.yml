services:
  caddy:
    image: caddy:2-alpine
    container_name: sailboat-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - routing-service
      - vpp-service
    networks:
      - routing-network

  vpp-service:
    build:
      context: ./services/vpp
      dockerfile: Dockerfile
    container_name: sailboat-vpp-service
    environment:
      - PORT=8000
    restart: unless-stopped
    networks:
      - routing-network

  routing-service:
    build:
      context: ./services/routing
      dockerfile: Dockerfile
    container_name: sailboat-routing-service
    environment:
      - PORT=8080
      - VPP_SERVICE_URL=http://vpp-service:8000
    depends_on:
      - vpp-service
    restart: unless-stopped
    networks:
      - routing-network

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: sailboat-routing-frontend
    depends_on:
      - routing-service
      - vpp-service
    restart: unless-stopped
    networks:
      - routing-network

networks:
  routing-network:
    driver: bridge

volumes:
  caddy_data:
    name: sailboat_caddy_data
  caddy_config:
    name: sailboat_caddy_config
