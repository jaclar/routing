# Development override: exposes internal services directly to host ports and enables Vite HMR
# Usage:
#   1. Backend in Docker + Vite on Host (Fastest & most ergonomic):
#      pnpm dev:backend   (or: docker compose -f docker-compose.yml -f docker-compose.dev.yml up routing-service vpp-service meteo-service)
#      pnpm dev           (in another terminal: runs Vite with instant HMR on http://localhost:4000)
#
#   2. Full stack in Docker with live reload:
#      pnpm dev:docker    (or: docker compose -f docker-compose.yml -f docker-compose.dev.yml up)

services:
  vpp-service:
    ports:
      - "4001:4001"

  meteo-service:
    ports:
      - "4081:4081"
    volumes:
      - ./data/store:/data/store

  meteo-worker:
    volumes:
      - ./data/store:/data/store

  routing-service:
    ports:
      - "4080:4080"

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./services/frontend:/app
      - /app/node_modules
    ports:
      - "4000:4000"
    environment:
      - ROUTING_SERVICE_URL=http://routing-service:4080
      - VPP_SERVICE_URL=http://vpp-service:4001
      - METEO_SERVICE_URL=http://meteo-service:4081
