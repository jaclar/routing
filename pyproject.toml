[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sail-vpp"
version = "0.1.0"
description = "Modern Sailboat Velocity Prediction Program (VPP) and FastAPI Service in Python"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "matplotlib>=3.5.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["vpp"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
